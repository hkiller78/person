<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="极简导航：常用网站快捷入口、图片浏览和小游戏。">
<title>极简导航</title>
<style>
  :root {
    --bg: #f0f8ff; --card: #ffffff; --text: #2c3e50; --muted: #667;
    --accent: #2980b9; --pink: #d81b60; --danger: #e74c3c;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181d; --card: #1f252c; --text: #e6edf3; --muted: #9aa7b3; --accent: #5aa9e6; --pink: #ff6b9d; --shadow: 0 1px 3px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg) url("background.jpg") center / cover fixed no-repeat;
  }
  main { max-width: 800px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { flex: 1; text-align: center; margin: 16px 0; font-size: clamp(20px, 5vw, 28px); }
  button, .btn { font: inherit; }
  .btn {
    display: block; padding: 12px; text-align: center; border: 0; border-radius: 8px;
    text-decoration: none; color: var(--text); background: var(--card);
    box-shadow: var(--shadow); cursor: pointer; transition: transform .1s;
  }
  .btn:hover, .btn:focus-visible { transform: translateY(-1px); }
  .btn:focus-visible, .lang:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-pink { color: var(--pink); }
  .btn-accent { color: var(--accent); font-weight: 600; border: 1px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
  .lang {
    padding: 6px 12px; font-size: 14px; background: var(--card); color: var(--text);
    border: 1px solid #bdc3c7; border-radius: 4px; cursor: pointer;
  }
  .gallery {
    margin-top: 20px; padding: 16px; background: var(--card); border-radius: 8px;
    box-shadow: var(--shadow); position: relative;
  }
  .gallery[hidden] { display: none; }
  .photo-box { min-height: 180px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: var(--bg); }
  .photo-box img { max-width: 100%; max-height: 60vh; object-fit: contain; }
  .gallery-bar { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .gallery-bar .btn { padding: 6px 14px; }
  .close {
    position: absolute; top: 8px; right: 8px; border: 0; border-radius: 4px;
    background: var(--danger); color: #fff; padding: 4px 8px; font-size: 12px; cursor: pointer; z-index: 1;
  }
  dialog { width: min(860px, 96vw); height: min(90vh, 360px); padding: 0; border: 0; border-radius: 8px; overflow: hidden; }
  dialog::backdrop { background: rgba(0,0,0,.5); }
  dialog iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<main>
  <header>
    <span style="width:48px" aria-hidden="true"></span>
    <h1 id="pageTitle" data-i18n="title">数据删除killer导航页</h1>
    <button id="langToggle" class="lang" type="button" aria-label="Switch language">EN</button>
  </header>

  <nav class="grid" aria-label="Links">
    <a class="btn" href="https://www.baidu.com" target="_blank" rel="noopener noreferrer" data-i18n="baidu">百度</a>
    <a class="btn" href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer" data-i18n="bilibili">B站</a>
    <a class="btn" href="https://www.microsoft.com/zh-cn/microsoft-365/outlook/email-and-calendar-software-microsoft-outlook" target="_blank" rel="noopener noreferrer" data-i18n="outlook">Outlook邮箱</a>
    <a class="btn btn-pink" href="https://space.bilibili.com/3546891629366171" target="_blank" rel="noopener noreferrer" data-i18n="mybilibili">我的b站空间</a>
    <a class="btn" href="https://github.com/hkiller78/My-papers" target="_blank" rel="noopener noreferrer" data-i18n="github">我的GitHub</a>
  </nav>

  <div class="grid">
    <button class="btn" id="photoBtn" type="button" data-i18n="photos">骇爪美图</button>
    <button class="btn btn-accent" id="gameBtn" type="button" data-i18n="game">别笑，你也过不了第二关</button>
  </div>

  <section class="gallery" id="gallery" hidden aria-label="Gallery">
    <button class="close" id="closePhoto" type="button" data-i18n="close">关闭</button>
    <div class="photo-box" id="photoBox"></div>
    <div class="gallery-bar">
      <button class="btn" id="prevBtn" type="button" data-i18n="prev">上一张</button>
      <span id="photoCount" aria-live="polite">0/0</span>
      <button class="btn" id="nextBtn" type="button" data-i18n="next">下一张</button>
    </div>
  </section>
</main>

<dialog id="gameDialog" aria-label="Game">
  <button class="close" id="closeGame" type="button" data-i18n="close">关闭</button>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);

  /* ---------- i18n ---------- */
  const i18n = {
    zh: { title: "数据删除killer导航页", baidu: "百度", bilibili: "B站", outlook: "Outlook邮箱",
          mybilibili: "我的b站空间", github: "我的GitHub", photos: "骇爪美图", game: "别笑，你也过不了第二关",
          prev: "上一张", next: "下一张", close: "关闭", alt: "图片" },
    en: { title: "Data Deletion Killer — Quick Links", baidu: "Baidu", bilibili: "Bilibili", outlook: "Outlook Email",
          mybilibili: "My Bilibili", github: "My GitHub", photos: "Photo Gallery", game: "Don't laugh, you can't pass level two",
          prev: "Previous", next: "Next", close: "Close", alt: "Photo" }
  };
  let lang = "zh";
  try { lang = localStorage.getItem("lang") || (navigator.language.startsWith("zh") ? "zh" : "en"); } catch (e) {}

  function applyLang(l) {
    lang = i18n[l] ? l : "zh";
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = i18n[lang][el.dataset.i18n]; });
    $("langToggle").textContent = lang === "zh" ? "EN" : "中文";
    document.title = lang === "zh" ? "极简导航" : "Minimal Navigation";
    if (!$("gallery").hidden) showPic();
    try { localStorage.setItem("lang", lang); } catch (e) {}
  }
  $("langToggle").addEventListener("click", () => applyLang(lang === "zh" ? "en" : "zh"));

  /* ---------- Gallery ---------- */
  const PHOTOS = ["1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpeg", "7.jpeg"];
  let order = [], idx = 0;

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function showPic() {
    const img = new Image();
    img.src = order[idx];
    img.alt = `${i18n[lang].alt} ${idx + 1}`;
    $("photoBox").replaceChildren(img);
    $("photoCount").textContent = `${idx + 1}/${order.length}`;
    // preload next image
    new Image().src = order[(idx + 1) % order.length];
  }
  function step(d) { idx = (idx + d + order.length) % order.length; showPic(); }

  $("photoBtn").addEventListener("click", () => {
    order = shuffle(PHOTOS); idx = 0;
    $("gallery").hidden = false;
    showPic();
    $("gallery").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });
  $("nextBtn").addEventListener("click", () => step(1));
  $("prevBtn").addEventListener("click", () => step(-1));
  $("closePhoto").addEventListener("click", () => { $("gallery").hidden = true; });

  document.addEventListener("keydown", e => {
    if ($("gallery").hidden || $("gameDialog").open) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "Escape") $("gallery").hidden = true;
  });

  // Swipe support
  let touchX = null;
  $("photoBox").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
  $("photoBox").addEventListener("touchend", e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1);
    touchX = null;
  });

  /* ---------- Game (loaded only when opened, removed when closed) ---------- */
  const dlg = $("gameDialog");
  $("gameBtn").addEventListener("click", () => {
    const f = document.createElement("iframe");
    f.src = "runner.html";
    f.title = "Runner game";
    dlg.appendChild(f);
    dlg.showModal();
    f.addEventListener("load", () => f.focus());
  });
  const closeGame = () => { dlg.close(); };
  $("closeGame").addEventListener("click", closeGame);
  dlg.addEventListener("close", () => dlg.querySelector("iframe")?.remove());

  applyLang(lang);
})();
</script>
</body>
</html>
